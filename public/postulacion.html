<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postulación - Autoridades de Mesa</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main>

        <h1>Inscribirse como postulante</h1>

        <p>
            Completá tus datos para registrarte como postulante
            a autoridad de mesa.
        </p>

        <section>
            <h2>Datos de inscripción</h2>

            <form id="form-postulacion">

                <div>
                    <label for="distrito">Distrito electoral:</label>
                    <select id="distrito" required>
                        <option value="">Seleccionar distrito</option>
                        <option value="San Miguel">San Miguel</option>
                        <option value="José C. Paz">José C. Paz</option>
                        <option value="Malvinas Argentinas">Malvinas Argentinas</option>
                        <option value="Tigre">Tigre</option>
                    </select>
                </div>

                <div>
                    <label for="nombre-postulante">Nombre:</label>
                    <input type="text" id="nombre-postulante" required>
                </div>

                <div>
                    <label for="apellido-postulante">Apellido:</label>
                    <input type="text" id="apellido-postulante" required>
                </div>

                <div>
                    <label for="dni-postulante">DNI:</label>
                    <input type="text" id="dni-postulante" required>
                </div>

                <div>
                    <label for="fecha-nacimiento">Fecha de nacimiento:</label>
                    <input type="date" id="fecha-nacimiento" required>
                </div>

                <div>
                    <label for="direccion-postulante">Dirección actual:</label>
                    <input type="text" id="direccion-postulante" required>
                </div>

                <div>
                    <label for="telefono-postulante">Teléfono:</label>
                    <input type="tel" id="telefono-postulante" required>
                </div>

                <div>
                    <label for="correo-postulante">Correo electrónico:</label>
                    <input type="email" id="correo-postulante" required>
                </div>

                <div>
                    <label for="autoridad-previa">
                        ¿Fue autoridad de mesa anteriormente?
                    </label>

                    <select id="autoridad-previa" required>
                        <option value="">Seleccionar</option>
                        <option value="si">Sí</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div>
                    <label for="afiliado">
                        ¿Está afiliado a alguna agrupación política?
                    </label>

                    <select id="afiliado" required>
                        <option value="">Seleccionar</option>
                        <option value="si">Sí</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div id="campo-agrupacion" style="display: none;">
                    <label for="agrupacion">Agrupación política:</label>
                    <input type="text" id="agrupacion">
                </div>

                <div>
                    <label for="charla-interes">
                        Interés en participar de una charla:
                    </label>

                    <select id="charla-interes">
                        <option value="">No deseo indicar</option>
                    </select>
                </div>

                <button type="submit">
                    Confirmar inscripción
                </button>

            </form>

            <p id="mensaje-postulacion"></p>
        </section>

        <p>
            <a href="index.html">Volver al inicio</a>
        </p>

    </main>
    <script src="js/charlaRepositorio.js"></script>
    <script src="js/postulacionRepositorio.js"></script>
    <script src="js/postulacionLogica.js"></script>
    <script src="js/vistaPostulacion.js"></script>

</body>
</html>
